name: Daily bulletin

on:
  schedule:
    # 07:00 UTC (08:00/09:00 in Spain depending on daylight saving time)
    - cron: '00 07 * * *'
  workflow_dispatch: # manual run button
    inputs:
      dry_run:
        description: 'Dry run: print the bulletin in the job log without sending it to Telegram'
        type: boolean
        default: true

jobs:
  bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # if the LLM stops responding, fail fast instead of hanging for hours
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Cava Agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_PROVIDER: groq
          PYTHONUNBUFFERED: "1"
          # Scheduled runs always send; manual runs only when "dry_run" is unchecked
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python daily_bulletin.py
