name: Cava Bot Diario

on:
  schedule:
    # Ajusta esta hora luego. Ahora está a las 18:00 UTC (19:00 en España)
    - cron: '00 12 * * *'
  workflow_dispatch: # Esta línea es la que crea el botón para forzarlo a mano

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar mi código
        uses: actions/checkout@v4
      
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar librerías
        run: pip install -r requirements.txt
        
      - name: Despertar a Cava Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python cava_bot.py
