name: Deploy demo (Hugging Face Space)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Deploy only after CI has passed
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Publish to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # A separate Groq key for the public demo protects the daily bulletin quota
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_DEMO || secrets.GROQ_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is missing: skipping the demo deployment."
            exit 0
          fi
          python scripts/deploy_space.py
