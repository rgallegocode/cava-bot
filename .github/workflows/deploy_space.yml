name: Deploy demo (Hugging Face Space)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Solo se despliega si los tests de CI han pasado
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar huggingface_hub
        run: pip install huggingface_hub

      - name: Publicar en el Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Una clave de Groq aparte para la demo pública protege la cuota del boletín diario
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_DEMO || secrets.GROQ_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::Falta el secreto HF_TOKEN: no se despliega la demo."
            exit 0
          fi
          python scripts/deploy_space.py
